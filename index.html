<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمر الحسين | مطور ويب محترف</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght=300;400;700;900&family=Fira+Code:wght=400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: rgba(20, 22, 37, 0.6);
            --primary-neon: #00ffcc;
            --secondary-neon: #0099ff;
            --text-main: #ffffff;
            --text-muted: #8fa0dd;
            --border-glow: rgba(0, 255, 204, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* خلفية الـ Canvas المتحركة */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* الهيدر الفاخر */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            backdrop-filter: blur(12px);
            background: rgba(10, 11, 16, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Fira Code', monospace;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        nav a:hover, nav a.active {
            color: var(--primary-neon);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* قسم الهيرو (البداية السينمائية) */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
        }

        .hero-badge {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero h1 span {
            background: linear-gradient(90deg, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-text {
            font-size: 1.8rem;
            color: var(--secondary-neon);
            font-family: 'Fira Code', monospace;
            min-height: 40px;
            margin-bottom: 2.5rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1.5rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(0, 255, 204, 0.6);
        }

        .btn-secondary {
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            border-color: var(--secondary-neon);
            color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(0, 153, 255, 0.3);
            transform: translateY(-3px);
        }

        /* ستايل الأقسام العامة */
        section {
            padding: 8rem 10% 4rem;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 4rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 0;
            width: 60px;
            height: 4px;
            background: var(--primary-neon);
            box-shadow: 0 0 10px var(--primary-neon);
        }

        /* شبكة المشاريع الأسطورية */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-neon);
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.15);
        }

        .project-img-wrapper {
            position: relative;
            height: 200px;
            background: linear-gradient(135deg, #1a1c2e, #0a0b10);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .project-img-wrapper i {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .project-card:hover .project-img-wrapper i {
            color: var(--primary-neon);
            transform: scale(1.1);
        }

        .project-content {
            padding: 1.5rem;
        }

        .project-tags {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .project-tag {
            font-size: 0.75rem;
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .project-links {
            display: flex;
            gap: 1rem;
        }

        .project-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .project-link:hover {
            color: var(--primary-neon);
        }

        /* شبكة المهارات المتطورة */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .skill-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .skill-box:hover {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 20px rgba(0, 153, 255, 0.15);
            transform: translateY(-5px);
        }

        .skill-box i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .skill-box h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* نموذج تواصل فضائي */
        .contact-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 20px;
            backdrop-filter: blur(15px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
